<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATRAN — Evermore Album Launch (Live at Barby)</title>
  <meta name="description" content="Watch the full Tatran concert — Evermore Album Launch, live at Barby Tel Aviv, July 4th 2024">
  <meta property="og:title" content="TATRAN — Evermore Album Launch (Live at Barby)">
  <meta property="og:description" content="Watch the full concert film. Pay what you want ($3 minimum).">
  <meta property="og:image" content="/poster.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #b8ab99;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      color: #1a1a2e;
      padding: 0;
    }

    .page {
      width: 100%;
      max-width: 780px;
      background-color: #d1c4b2;
      background-image: url('/texture-tile.jpg');
      background-size: cover;
      background-blend-mode: multiply;
      min-height: 100vh;
      position: relative;
      padding-bottom: 12px;
    }

    /* ==================== POSTER ==================== */
    .poster-wrap {
      position: relative;
      padding: 24px 24px 0;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Play button — positioned at center-bottom of poster, over TATRAN text */
    .play-btn {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 62px;
      height: 44px;
      background: rgba(0, 0, 0, 0.78);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 9px 0 9px 16px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }

    /* ==================== CTA CARD ==================== */
    .cta-outer {
      margin: 10px 24px 0;
      padding: 3px;
      background: linear-gradient(
        160deg,
        rgba(100, 130, 200, 0.5) 0%,
        rgba(180, 120, 200, 0.45) 15%,
        rgba(220, 170, 120, 0.4) 30%,
        rgba(100, 160, 220, 0.45) 45%,
        rgba(200, 100, 160, 0.5) 60%,
        rgba(120, 190, 220, 0.45) 75%,
        rgba(180, 140, 200, 0.4) 90%,
        rgba(100, 130, 200, 0.5) 100%
      );
      background-size: 400% 400%;
      animation: shimmer 8s ease infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .cta-card {
      background-color: #d1c4b2;
      background-image: url('/texture-tile.jpg');
      background-size: cover;
      background-blend-mode: multiply;
      padding: 30px 30px 26px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    /* Left column */
    .cta-heading {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 46px;
      font-weight: 400;
      line-height: 0.92;
      text-transform: uppercase;
      color: #f25c45;
      letter-spacing: 0.015em;
      margin-bottom: 16px;
    }

    .cta-desc {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.55;
      text-transform: uppercase;
      letter-spacing: 0.005em;
      color: #1a1a2e;
    }

    /* Right column */
    .cta-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .price-label {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #1a1a2e;
    }

    .price-label .note {
      font-weight: 400;
      font-size: 10.5px;
      opacity: 0.5;
    }

    /* Slider row */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(90deg, #2a2a3e var(--fill, 0%), #a89e90 var(--fill, 0%));
    }

    .price-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #d1c4b2;
      border: 2px solid #2a2a3e;
      border-radius: 50%;
      cursor: pointer;
    }

    .price-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #d1c4b2;
      border: 2px solid #2a2a3e;
      border-radius: 50%;
      cursor: pointer;
      box-sizing: border-box;
    }

    .price-box {
      width: 50px;
      height: 32px;
      border: 2px solid #1a1a2e;
      border-radius: 0;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
      background: transparent;
      font-family: inherit;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }

    .price-box::-webkit-inner-spin-button,
    .price-box::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* CTA Button */
    .cta-btn {
      width: 100%;
      padding: 14px 10px;
      background: transparent;
      border: 2.5px solid #f25c45;
      color: #f25c45;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      font-weight: 400;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.15;
    }

    .cta-btn:hover {
      background: #f25c45;
      color: #fff;
    }

    .cta-btn:active { transform: scale(0.97); }

    .cta-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .support-text {
      font-size: 11.5px;
      color: #1a1a2e;
      opacity: 0.5;
    }

    /* Payment methods — SVG icons */
    .pay-methods {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .pay-methods svg {
      height: 18px;
      width: auto;
      opacity: 0.4;
    }

    /* ==================== FOOTER ==================== */
    .footer {
      padding: 18px 24px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #1a1a2e;
      opacity: 0.3;
    }

    .footer .sep { opacity: 0.5; }

    /* ==================== MOBILE ==================== */
    @media (max-width: 580px) {
      .poster-wrap { padding: 16px 16px 0; }
      .cta-outer { margin: 8px 16px 0; }
      .cta-card {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 24px 22px 22px;
      }
      .cta-heading { font-size: 38px; }
      .footer { font-size: 9.5px; gap: 5px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="poster-wrap">
      <img class="poster-img" src="/poster.jpg" alt="TATRAN — Evermore Album Launch, Live at Barby Tel Aviv, July 4th 2024" />
      <div class="play-btn"></div>
    </div>

    <div class="cta-outer">
      <div class="cta-card">

        <div class="cta-left">
          <div class="cta-heading">Full Concert<br>Film Access</div>
          <div class="cta-desc">
            Stream the entire legendary live performance. A high-definition audio-visual experience.<br>
            Pay $3 or more to access instantly.
          </div>
        </div>

        <div class="cta-right">
          <div class="price-label">Price: $<span id="priceText">3.00</span> USD <span class="note">(Pay More Option Below)</span></div>

          <div class="slider-row">
            <input type="range" class="price-slider" id="priceSlider" min="3" max="50" value="3" step="1">
            <input type="text" class="price-box" id="priceInput" value="$3">
          </div>

          <button class="cta-btn" id="payBtn" onclick="checkout()">
            Secure Full Access<br>(From $3)
          </button>

          <div class="support-text">Pay $3 or more to support the band.</div>

          <div class="pay-methods">
            <!-- Visa -->
            <svg viewBox="0 0 48 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="0" y="13" font-family="Arial,sans-serif" font-weight="bold" font-size="13" fill="#1a1a2e">VISA</text>
            </svg>
            <!-- Mastercard -->
            <svg viewBox="0 0 30 18" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="9" r="8" fill="#1a1a2e" opacity="0.7"/>
              <circle cx="20" cy="9" r="8" fill="#1a1a2e" opacity="0.5"/>
            </svg>
            <!-- Apple Pay -->
            <svg viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="0" y="13" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a2e"><tspan font-family="system-ui" font-weight="400">&#xF8FF;</tspan>Pay</text>
            </svg>
            <!-- Google Pay -->
            <svg viewBox="0 0 44 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="0" y="14" font-family="Arial,sans-serif" font-weight="bold" font-size="13" fill="#1a1a2e">G</text>
              <text x="12" y="14" font-family="Arial,sans-serif" font-size="12" fill="#1a1a2e">Pay</text>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <div class="footer">
      <span>Terms of Use</span>
      <span class="sep">|</span>
      <span>Privacy Policy</span>
      <span class="sep">|</span>
      <span>Copyright TATRAN 2024</span>
    </div>

  </div>

  <script>
    const slider = document.getElementById('priceSlider');
    const priceInput = document.getElementById('priceInput');
    const priceText = document.getElementById('priceText');

    function syncSliderFill() {
      const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
      slider.style.setProperty('--fill', pct + '%');
    }

    function getNumericPrice() {
      return Math.max(3, Math.floor(Number(priceInput.value.replace(/[^0-9]/g, '')) || 3));
    }

    slider.addEventListener('input', () => {
      priceInput.value = '$' + slider.value;
      priceText.textContent = Number(slider.value).toFixed(2);
      syncSliderFill();
    });

    priceInput.addEventListener('focus', () => {
      const num = getNumericPrice();
      priceInput.value = num;
      priceInput.select();
    });

    priceInput.addEventListener('blur', () => {
      const v = getNumericPrice();
      priceInput.value = '$' + v;
      slider.value = Math.min(v, 50);
      priceText.textContent = v.toFixed(2);
      syncSliderFill();
    });

    syncSliderFill();

    async function checkout() {
      const btn = document.getElementById('payBtn');
      const amount = getNumericPrice();

      btn.disabled = true;
      btn.innerHTML = 'Loading\u2026';

      try {
        const res = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount })
        });
        const data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          alert(data.error || 'Something went wrong');
          resetBtn();
        }
      } catch {
        alert('Connection error. Please try again.');
        resetBtn();
      }
    }

    function resetBtn() {
      const btn = document.getElementById('payBtn');
      btn.disabled = false;
      btn.innerHTML = 'Secure Full Access<br>(From $3)';
    }
  </script>
</body>
</html>
